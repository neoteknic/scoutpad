plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.neote.moorebotscout'
    compileSdk 35

    defaultConfig {
        applicationId 'com.neote.moorebotscout'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main.assets.srcDirs = ['../../public', 'src/main/assets']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.register('syncVendorAssets', Copy) {
    from('../../node_modules/hls.js/dist/hls.min.js')
    into('src/main/assets/vendor')
}

tasks.register('syncSoundIcons', Copy) {
    from('../../node_modules/lucide/dist/umd/lucide.min.js')
    into('src/main/assets/vendor')
}

preBuild.dependsOn syncVendorAssets
preBuild.dependsOn syncSoundIcons

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation files('libs/mobilebridge.aar')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
